[supervisord]
nodaemon=true
; Il container gira come utente senza privilegi (Dockerfile). Log e pid di
; supervisord non vanno nella directory dell'applicazione (default con -c):
; i log dei programmi vanno gia' su stdout del container.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:site]
command=sh -c "python manage.py migrate &&
               gunicorn myproject.wsgi:application \
               --bind 0.0.0.0:8000 \
               --workers 4 --threads 2 --timeout 300 --graceful-timeout 300"
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
; /dev/stdout non si puo' ruotare: senza questo supervisord chiude il canale
stdout_logfile_maxbytes=0

[program:sparql]
command=python run_sparql_server.py
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
; /dev/stdout non si puo' ruotare: senza questo supervisord chiude il canale
stdout_logfile_maxbytes=0



[program:ontop]
command=sh -c "./myapp/obda/ontop endpoint \
               -c hereditary_ontology_2.properties \
               -p 8080"
directory=/app/myapp/obda
autostart=false
autorestart=false
redirect_stderr=true
stdout_logfile=/dev/stdout
; /dev/stdout non si puo' ruotare: senza questo supervisord chiude il canale
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr

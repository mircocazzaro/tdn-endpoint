{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First start - Trusted Data Network</title>
  <link rel="stylesheet" href="{% static 'myapp/vendor/bootstrap-5.3.0/bootstrap.min.css' %}">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 460px;">
    <div class="text-center mb-4">
      <img src="{% static 'myapp/logo.png' %}" alt="" height="48" class="mb-2">
      <h1 class="h4">Create the administrator</h1>
      <p class="text-muted small mb-0">This page is available only until the first user exists.</p>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        {% if error %}
          <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="{% url 'setup' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ username }}"
                   autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password1" class="form-label">Password</label>
            <input type="password" class="form-control" id="password1" name="password1"
                   autocomplete="new-password" required>
            <div class="form-text">At least 10 characters, not too common, not similar to the username.</div>
          </div>
          <div class="mb-3">
            <label for="password2" class="form-label">Repeat the password</label>
            <input type="password" class="form-control" id="password2" name="password2"
                   autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Create and sign in</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>

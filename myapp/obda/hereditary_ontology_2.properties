jdbc.url = jdbc:duckdb:mydatabase.duckdb
jdbc.driver = org.duckdb.DuckDBDriver
# Ontop apre i dati in sola lettura: un endpoint che risponde a query federate
# non deve poter scrivere, e DuckDB ammette piu' processi in sola lettura ma un
# solo processo in scrittura, che esclude anche i lettori. In sola lettura la UI
# di amministrazione puo' leggere lo schema mentre l'endpoint e' attivo.
# Ontop passa al driver JDBC le proprieta' con prefisso jdbc.property.
jdbc.property.duckdb.read_only = true
